* { margin: 0; padding: 0; box-sizing: border-box; }

}

.stats-panel { min-width: 200px; }

}

.ctrl-btn {

}
.ctrl-btn:hover { background: rgba(100, 130, 200, 0.25); color: #d0d0f0; }
.ctrl-btn.active { background: rgba(110, 168, 254, 0.25); border-color: #6ea8fe; color: #6ea8fe; }

.ctrl-label { color: #5a5a80; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
input[type=range] {
  -webkit-appearance: none; width: 100px; height: 3px;
  background: rgba(100, 130, 200, 0.2); border-radius: 2px; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;

}

#tooltip {

}
#tooltip .tt-title { color: #6ea8fe; font-weight: 600; margin-bottom: 4px; font-size: 13px; }

const CLUSTER_COLORS = [
  0x6ea8fe, 0xa78bfa, 0x4ade80, 0xf97316, 0xfbbf24,
  0xf472b6, 0x22d3ee, 0x94a3b8, 0xe879f9
];

// Scene setup
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x06060c);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06060c, 0.003);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(80, 60, 80);
camera.lookAt(0, 0, 0);

// Orbit controls (manual implementation)
let isDragging = false, isPanning = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { r: 120, theta: Math.PI / 4, phi: Math.PI / 4 };
let target = new THREE.Vector3(0, 0, 0);
let autoSpin = false;

function updateCamera() {
  camera.position.x = target.x + spherical.r * Math.sin(spherical.theta) * Math.cos(spherical.phi);
  camera.position.y = target.y + spherical.r * Math.cos(spherical.theta);
  camera.position.z = target.z + spherical.r * Math.sin(spherical.theta) * Math.sin(spherical.phi);
  camera.lookAt(target);
}
updateCamera();

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) isDragging = true;
  if (e.button === 2) isPanning = true;
  prevMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mousemove', e => {
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  if (isDragging) {
    spherical.phi -= dx * 0.005;
    spherical.theta = Math.max(0.05, Math.min(Math.PI - 0.05, spherical.theta + dy * 0.005));
    updateCamera();
  }
  if (isPanning) {
    const right = new THREE.Vector3();
    const up = new THREE.Vector3();
    camera.getWorldDirection(up);
    right.crossVectors(up, camera.up).normalize();
    up.copy(camera.up).normalize();
    target.addScaledVector(right, -dx * 0.08);
    target.addScaledVector(up, dy * 0.08);
    updateCamera();
  }
  prevMouse = { x: e.clientX, y: e.clientY };
  onMouseMove(e);
});
canvas.addEventListener('mouseup', () => { isDragging = false; isPanning = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  spherical.r = Math.max(10, Math.min(300, spherical.r + e.deltaY * 0.08));
  updateCamera();
});

// Build nodes with instanced mesh
const N = TOPO.meta.N;
const baseSize = 0.35;
let sizeMult = 1.0;
const geo = new THREE.SphereGeometry(1, 8, 6);
const mat = new THREE.MeshPhongMaterial({ shininess: 40, transparent: true, opacity: 0.92 });
const instancedMesh = new THREE.InstancedMesh(geo, mat, N);

const positions = new Float32Array(N * 3);
const nodeColors = new Float32Array(N * 3);
const dummy = new THREE.Object3D();
const degreeArr = TOPO.nodes.degree;
const maxDeg = Math.max(...degreeArr);
const minDeg = Math.min(...degreeArr);

let colorMode = 0; // 0=cluster, 1=degree, 2=weight

function setNodeColors() {
  const c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    if (colorMode === 0) {
      c.setHex(CLUSTER_COLORS[TOPO.nodes.cluster[i] % CLUSTER_COLORS.length]);
    } else if (colorMode === 1) {
      const t = (degreeArr[i] - minDeg) / (maxDeg - minDeg);
      c.setHSL(0.55 - t * 0.5, 0.8, 0.35 + t * 0.4);
    } else {
      const wMin = 0.545, wMax = 0.66;
      const t = (TOPO.nodes.w[i] - wMin) / (wMax - wMin);
      c.setHSL(0.08 + t * 0.25, 0.85, 0.4 + t * 0.3);
    }
    instancedMesh.setColorAt(i, c);
  }
  instancedMesh.instanceColor.needsUpdate = true;
}

function updateNodeTransforms() {
  for (let i = 0; i < N; i++) {
    const s = baseSize * sizeMult * (0.5 + 1.5 * (degreeArr[i] - minDeg) / (maxDeg - minDeg));
    dummy.position.set(TOPO.nodes.x[i], TOPO.nodes.y[i], TOPO.nodes.z[i]);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
    positions[i * 3] = TOPO.nodes.x[i];
    positions[i * 3 + 1] = TOPO.nodes.y[i];
    positions[i * 3 + 2] = TOPO.nodes.z[i];
  }
  instancedMesh.instanceMatrix.needsUpdate = true;
}

setNodeColors();
updateNodeTransforms();
scene.add(instancedMesh);

// Edges
const edgeGeo = new THREE.BufferGeometry();
const edgeVerts = new Float32Array(TOPO.edges.src.length * 6);
for (let i = 0; i < TOPO.edges.src.length; i++) {
  const s = TOPO.edges.src[i], d = TOPO.edges.dst[i];
  edgeVerts[i * 6]     = TOPO.nodes.x[s];
  edgeVerts[i * 6 + 1] = TOPO.nodes.y[s];
  edgeVerts[i * 6 + 2] = TOPO.nodes.z[s];
  edgeVerts[i * 6 + 3] = TOPO.nodes.x[d];
  edgeVerts[i * 6 + 4] = TOPO.nodes.y[d];
  edgeVerts[i * 6 + 5] = TOPO.nodes.z[d];
}
edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgeVerts, 3));
let edgeAlpha = 0.08;
const edgeMat = new THREE.LineBasicMaterial({ color: 0x3366aa, transparent: true, opacity: edgeAlpha, depthWrite: false });
const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
scene.add(edgeLines);

    ttTitle.textContent = `Node ${idx}`;
    ttBody.innerHTML = `Degree: ${degreeArr[idx]}<br>W: ${TOPO.nodes.w[idx].toFixed(4)}<br>Cluster: ${TOPO.nodes.cluster[idx]}`;
    tooltip.style.display = 'block';
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY + 14) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
}

// Controls
let showEdges = true;
function toggleEdges() {
  showEdges = !showEdges;
  edgeLines.visible = showEdges;
  document.getElementById('btn-edges').classList.toggle('active', showEdges);
}
function toggleSpin() {
  autoSpin = !autoSpin;
  document.getElementById('btn-spin').classList.toggle('active', autoSpin);
}
function updateSize(v) {
  sizeMult = parseFloat(v);
  updateNodeTransforms();
}
function updateEdgeAlpha(v) {
  edgeAlpha = parseFloat(v);
  edgeMat.opacity = edgeAlpha;
}
const colorLabels = ['Cluster', 'Degree', 'Weight'];
function cycleColor() {
  colorMode = (colorMode + 1) % 3;
  setNodeColors();
  document.getElementById('btn-color').textContent = 'Color: ' + colorLabels[colorMode];
}

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animate
function animate() {
  requestAnimationFrame(animate);
  if (autoSpin) {
    spherical.phi += 0.003;
    updateCamera();
  }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
